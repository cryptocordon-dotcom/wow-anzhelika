}
function renderPng(){
  const base=LAYERS.dir+LAYERS.base(), seq=++pngSeq;
  probe(base).then(ok=>{ if(seq!==pngSeq) return; const cv=$("#canvas"), box=$("#layers"); if(!box) return;
    if(ok!==pngMode){ pngMode=ok; cv.classList.toggle("png",ok); }
    if(!ok){ box.innerHTML=""; return; }
    const ly=[["base",base],["coat",LAYERS.dir+LAYERS.coat()]].concat(state.decor.filter(d=>!["d_print","d_custom"].includes(d)).map(d=>["decor",LAYERS.dir+LAYERS.decor(d)]));
    box.innerHTML=ly.map(([k,src])=>`<img class="ly ly-${k}" src="${src}" alt="" onerror="this.remove()">`).join("");
    placePrint(); });
}
/* CSS-искажение фото для съедобной печати: кладём картинку на «крышку» торта с перспективой */
function applyPrintTransform(el,{x,y,w,tilt,scale,shape}){
  el.style.left=(x-w/2)+"%"; el.style.top=(y-w/2)+"%"; el.style.width=w+"%";
  el.style.setProperty("--tilt",tilt.toFixed(1)+"deg"); el.style.setProperty("--sc",scale); el.dataset.shape=shape; }
function placePrint(){
  const el=$("#printLayer"); if(!el) return;
  const on=hasD("d_print") && !!state.print && !(state.cut&&state.tiers===1);
  el.classList.toggle("on",on); if(!on) return; el.querySelector("img").src=state.print;
  const sc = slotCount()||hasD("d_gold") ? .64 : hasD("d_candle")&&state.candle ? .72 : .8;
  if(pngMode){ const f=LAYERS.printFit[state.shape]; applyPrintTransform(el,{...f,scale:sc,shape:state.shape}); return; }
  const T=$("#canvas")._top; if(!T) return;
  applyPrintTransform(el,{x:T.cx/4,y:T.top/4,w:T.w/4,tilt:Math.acos(Math.min(.99,T.h/T.w))*180/Math.PI,scale:sc,shape:state.shape});
}
const slotCount = ()=> state.decor.filter(d=>DECOR_SLOT.includes(d)).length;
function readImage(file,cb){ if(!file||!/^image\//.test(file.type)) return; const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,900/Math.max(im.width,im.height)), c=document.createElement("canvas");
      c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      try{ cb(c.toDataURL("image/jpeg",.86)); }catch(e){ cb(r.result); } }; im.onerror=()=>cb(r.result); im.src=r.result; };
  r.readAsDataURL(file); }

function setGuests(g){ g=Math.min(GUESTS.max,Math.max(GUESTS.min,g)); if(g===state.guests) return;
  const before=[state.size,state.tiers].join(); state.guests=g; recalcCake(); syncActive();

function pickOption(k,v){
  if(k==="decor"){ const has=hasD(v);
    if(!has && DECOR_SLOT.includes(v) && slotCount()>=BUILD.maxDecor){ toast(t("decor_max").replace("{n}",BUILD.maxDecor)); return; }
    state.decor = has ? state.decor.filter(x=>x!==v) : [...state.decor,v];
    syncActive(); updatePreview(["d_print","d_custom","d_candle"].includes(v)?"none":"deco");
    if(!has && ["d_print","d_custom","d_candle"].includes(v)) setTimeout(()=>{ const x=document.querySelector(`.revx[data-for="${v}"] input:not([type=file]), .revx[data-for="${v}"] .drop`); if(x){ x.scrollIntoView({behavior:"smooth",block:"nearest"}); if(x.tagName==="INPUT") x.focus({preventScroll:true}); } },420);
    return; }
  if(k==="occasion"){ state.occasion = state.occasion===v ? "" : v; const before=[state.size,state.tiers].join(); recalcCake(); syncActive();
    updatePreview(before!==[state.size,state.tiers].join()?"full":"none"); return; }
  if(k==="tiers"){ v=+v; state._tiersTouched=true; }
  const changed=state[k]!==v; state[k]=v;
  if(k==="tiers" && v>1) state.cut=false;
  syncActive();
  if(k==="msgr"){ updateSend(); return; }
  if(changed) updatePreview({shape:"full",tiers:"full",filling:"deco",sponge:"cut",textPos:"none"}[k]||"fade");
}

   Можно сохранить несколько дат сразу. Данные уходят в CONFIG.reminderEndpoint (ваша база / Google-таблица).
   ========================================================= */
const CARE_EVENTS = ["ev_bday","ev_kid","ev_anniv","ev_wed","ev_jub","ev_other"];
const CARE_LEADS = [3,7,14];                 // за сколько дней напомнить
const CARE_MSGRS = ["tg","wa","viber"];
const care = {ev:"ev_bday", lead:7, msgr:"tg", day:15, month:4, list:[]};   // month: 0–11
const monthName = (m,L=lang,form="long")=> new Intl.DateTimeFormat(HTML_LANG[L],{month:form}).format(new Date(2026,m,1));
const dayMonth = (d,m,L=lang)=> new Intl.DateTimeFormat(HTML_LANG[L],{day:"numeric",month:"long"}).format(new Date(2026,m,d));
const evName = (e,L=lang)=> e.ev==="ev_other" ? (e.other||t("ev_other",L)) : t(e.ev,L);
function careCurrent(){ return {ev:care.ev, other:$("#cOther").value.trim(), who:$("#cWho").value.trim(), day:care.day, month:care.month, lead:care.lead}; }
function renderCare(){
  if(!$("#cEvents")) return;
  $("#cEvents").innerHTML=CARE_EVENTS.map(id=>`<button type="button" class="chip${care.ev===id?" on":""}" data-cev="${id}">${t(id)}</button>`).join("");
  $("#cLeads").innerHTML=CARE_LEADS.map(n=>`<button type="button" class="opt segb${care.lead===n?" on":""}" data-clead="${n}">${t("lead_"+n)}</button>`).join("");
  $("#cMsgrs").innerHTML=CARE_MSGRS.map(m=>`<button type="button" class="opt segb${care.msgr===m?" on":""}" data-cmsgr="${m}">${{tg:"Telegram",wa:"WhatsApp",viber:"Viber"}[m]}</button>`).join("");
  const days=new Date(2028,care.month+1,0).getDate(); if(care.day>days) care.day=days;   /* 2028 — високосный: 29 февраля доступно */
  $("#cDay").innerHTML=Array.from({length:days},(_,i)=>`<option value="${i+1}"${i+1===care.day?" selected":""}>${i+1}</option>`).join("");
  $("#cMonth").innerHTML=Array.from({length:12},(_,m)=>`<option value="${m}"${m===care.month?" selected":""}>${monthName(m)}</option>`).join("");
  $("#cOther").hidden=care.ev!=="ev_other";
  renderCareList(); careSync();
}
function renderCareList(){
  $("#cList").innerHTML=care.list.map((e,i)=>`<div class="care-item"><b>${esc(dayMonth(e.day,e.month))}</b><span>${esc(evName(e))}${e.who?" · "+esc(e.who):""}</span><button type="button" class="x-sm" data-cdel="${i}" aria-label="×">×</button></div>`).join("");
  $("#cSave").textContent = t(care.list.length?"cr_save_n":"care_btn").replace("{n}",care.list.length+1);
}
/* живое превью: листок календаря и сообщение от Анжелики */
function careSync(){
  const e=careCurrent(), nm=$("#cName").value.trim();
  $("#cpDay").textContent=e.day; $("#cpMonth").textContent=monthName(e.month,lang,"long"); $("#cpEv").textContent=evName(e);
  $("#cpMsg").textContent=t("cr_msg").replace("{name}",nm?", "+nm:"").replace("{lead}",t("lead_in_"+e.lead))
    .replace("{event}",evName(e).toLowerCase()).replace("{who}",e.who?" ("+e.who+")":"").replace("{date}",dayMonth(e.day,e.month));
}
function careValid(fields){ let ok=true; fields.forEach(el=>{ const bad=el.type==="checkbox"?!el.checked:!el.value.trim(); el.classList.remove("err"); if(bad){ void el.offsetWidth; el.classList.add("err"); ok=false; } }); return ok; }
$("#careForm").addEventListener("click",e=>{
  const ev=e.target.closest("[data-cev]"); if(ev){ care.ev=ev.dataset.cev; renderCare(); if(care.ev==="ev_other") $("#cOther").focus(); return; }
  const ld=e.target.closest("[data-clead]"); if(ld){ care.lead=+ld.dataset.clead; renderCare(); return; }
  const ms=e.target.closest("[data-cmsgr]"); if(ms){ care.msgr=ms.dataset.cmsgr; renderCare(); return; }
  const del=e.target.closest("[data-cdel]"); if(del){ care.list.splice(+del.dataset.cdel,1); renderCareList(); return; }
  if(e.target.closest("#cAdd")){ if(care.ev==="ev_other" && !careValid([$("#cOther")])) return;
    care.list.push(careCurrent()); $("#cWho").value=""; $("#cOther").value=""; renderCareList(); careSync(); care.fresh=true; toast(t("cr_added")); return; }
});
const careTouch=e=>{ if(["cDay","cMonth","cWho","cOther"].includes(e.target.id)||e.target.closest("[data-cev],[data-clead]")) care.fresh=false; };
$("#careForm").addEventListener("click",careTouch,true);
$("#careForm").addEventListener("change",e=>{ careTouch(e); if(e.target.id==="cDay") care.day=+e.target.value; if(e.target.id==="cMonth"){ care.month=+e.target.value; renderCare(); } careSync(); });
$("#careForm").addEventListener("input",e=>{ careTouch(e); e.target.classList.remove("err"); careSync(); });
$("#careForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const need=[$("#cName"),$("#cContact"),$("#cConsent")]; if(care.ev==="ev_other"&&!care.list.length) need.push($("#cOther"));
  if(!careValid(need)){ if(!$("#cConsent").checked) toast(t("cr_need_consent")); return; }
  const cur=careCurrent(), events=[...care.list]; if(!events.length || !care.fresh) events.push(cur);   /* fresh — форму не трогали после «Добавить ещё» */
  const uniq=events.filter((x,i,a)=>a.findIndex(y=>y.day===x.day&&y.month===x.month&&y.ev===x.ev&&y.who===x.who)===i);
  const rec={name:$("#cName").value.trim(),contact:$("#cContact").value.trim(),messenger:care.msgr,lang,created:new Date().toISOString(),
    events:uniq.map(x=>({event:evName(x,"ru"),who:x.who,day:x.day,month:x.month+1,remind_days_before:x.lead}))};
  try{ const all=JSON.parse(store.get("vc_dates")||"[]"); all.push(rec); store.set("vc_dates",JSON.stringify(all)); }catch(err){}
  if(CONFIG.reminderEndpoint){ try{ await fetch(CONFIG.reminderEndpoint,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(rec)}); }catch(err){} }
  const L=CONFIG.orderLang||lang;
  $("#careOkText").textContent=t(uniq.length>1?"cr_ok_many":"care_ok_text");
  $("#careOkList").innerHTML=uniq.map(x=>`<li><b>${esc(dayMonth(x.day,x.month))}</b> — ${esc(evName(x))}${x.who?" · "+esc(x.who):""} <small>${esc(t("lead_"+x.lead))}</small></li>`).join("");
  $("#careWa").href=waLink(`${t("care_msg",L)}\n\n${uniq.map(x=>`• ${dayMonth(x.day,x.month,L)} — ${evName(x,L)}${x.who?" ("+x.who+")":""}, ${t("cr_remind",L)} ${t("lead_"+x.lead,L)}`).join("\n")}\n\n${t("care_name",L)}: ${rec.name}\n${t("cr_contact",L)}: ${rec.contact} (${{tg:"Telegram",wa:"WhatsApp",viber:"Viber"}[care.msgr]})`);
  openModal("#careModal");
  care.list=[]; care.fresh=false; $("#cWho").value=""; $("#cOther").value=""; renderCare();
});

/* =========================================================
   ЭФФЕКТЫ: сахарная пыль в hero и «посыпка»-конфетти
   ========================================================= */
let FXC={acc:"#D4AF37",blush:"#E6B3AE"};
function refreshFxColors(){ const cs=getComputedStyle(document.documentElement); FXC.acc=cs.getPropertyValue("--accent").trim()||FXC.acc; FXC.blush=cs.getPropertyValue("--blush").trim()||FXC.blush; FXC.night=document.documentElement.dataset.theme==="night"; FXC.snow=cs.getPropertyValue("--snow").trim()||"#fff"; }
let mxS=0;
function snowfall(c,dense){
  if(!c||REDUCED) return; const ctx=c.getContext("2d"), dpr=Math.min(devicePixelRatio||1,2); let W=0,H=0,run=false; const F=[];
  const size=()=>{ W=c.clientWidth; H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  const N=Math.round((innerWidth<640?24:52)*dense);
  const spawn=init=>({x:Math.random()*W,y:init?Math.random()*H:-12,r:.8+Math.random()*2.4,big:Math.random()<.13,vy:.25+Math.random()*.55,sw:Math.random()*6.28,ss:.004+Math.random()*.01,a:.35+Math.random()*.55,rot:Math.random()*6.28});
  size(); addEventListener("resize",size); for(let i=0;i<N;i++) F.push(spawn(true));
  new IntersectionObserver(es=>{ const was=run; run=es[0].isIntersecting; if(run&&!was) requestAnimationFrame(loop); }).observe(c);
  function loop(){ if(!run) return; ctx.clearRect(0,0,W,H); ctx.fillStyle=ctx.strokeStyle=FXC.snow||"#fff";
    for(const f of F){ f.y+=f.vy*(f.big?.7:1); f.sw+=f.ss; f.rot+=.004; if(f.y>H+14) Object.assign(f,spawn(false));
      const x=f.x+Math.sin(f.sw)*18+mxS*f.r*6; ctx.globalAlpha=f.a;
      if(f.big){ ctx.save(); ctx.translate(x,f.y); ctx.rotate(f.rot); ctx.lineWidth=1.1; ctx.lineCap="round"; ctx.beginPath(); const L=f.r*2.6;
        for(let k=0;k<6;k++){ const a=k*Math.PI/3; ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*L,Math.sin(a)*L); ctx.moveTo(Math.cos(a)*L*.55,Math.sin(a)*L*.55); ctx.lineTo(Math.cos(a+.45)*L*.8,Math.sin(a+.45)*L*.8); ctx.moveTo(Math.cos(a)*L*.55,Math.sin(a)*L*.55); ctx.lineTo(Math.cos(a-.45)*L*.8,Math.sin(a-.45)*L*.8); }
        ctx.stroke(); ctx.restore(); }
      else { ctx.beginPath(); ctx.arc(x,f.y,f.r,0,6.283); ctx.fill(); } }
    ctx.globalAlpha=1; requestAnimationFrame(loop); }
}
/* Глянцевые ленты карамели медленно текут по экрану (вместо макро-видео) */
function caramelFlow(c){
  if(!c||CONFIG.heroVideo) return; const ctx=c.getContext("2d"), dpr=Math.min(devicePixelRatio||1,2); let W=0,H=0,run=false,t=0,last=0;
  const R=[{b:.30,a:.07,f:1.6,s:.16,w:.075,p:0,al:.55},{b:.48,a:.06,f:2.1,s:-.12,w:.05,p:2,al:.42},{b:.66,a:.08,f:1.3,s:.1,w:.095,p:4,al:.6},{b:.84,a:.05,f:2.6,s:-.18,w:.045,p:1,al:.38}];
  function size(){ const r=c.getBoundingClientRect(); W=r.width; H=r.height; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  function pal(){ return FXC.night?["#4a3a10","#a6862a","#D4AF37","#f6e7b0"]:["#7a4518","#b06f30","#C68642","#f3cf9c"]; }
  function frame(now){ if(!run) return; t+=Math.min(50,now-(last||now))/1000; last=now; ctx.clearRect(0,0,W,H);
    const P=pal(), ang=-.32, L=Math.hypot(W,H)*1.1; ctx.save(); ctx.translate(W*.62,H*.52); ctx.rotate(ang);
    R.forEach(r=>{ const y0=(r.b-.55)*H*1.2, N=60, top=[], bot=[];
      for(let i=0;i<=N;i++){ const u=i/N, x=-L/2+u*L, ph=u*Math.PI*r.f+t*r.s*2+r.p;
        const y=y0+Math.sin(ph)*r.a*H+Math.sin(ph*.47+t*.3)*r.a*.5*H, w=r.w*H*(.65+.35*Math.sin(ph*1.3+t*.4+r.p));
        top.push([x,y-w/2]); bot.push([x,y+w/2]); }
      const g=ctx.createLinearGradient(0,y0-r.w*H-r.a*H,0,y0+r.w*H+r.a*H); g.addColorStop(0,P[3]); g.addColorStop(.35,P[2]); g.addColorStop(.7,P[1]); g.addColorStop(1,P[0]);
      ctx.globalAlpha=r.al; ctx.fillStyle=g; ctx.beginPath(); top.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); for(let i=bot.length-1;i>=0;i--) ctx.lineTo(bot[i][0],bot[i][1]); ctx.closePath(); ctx.fill();
      /* глянцевый блик по верхнему краю */
      ctx.globalAlpha=r.al*.7; ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=1.4; ctx.beginPath(); top.forEach(([x,y],i)=>{ const yy=y+r.w*H*.18; i?ctx.lineTo(x,yy):ctx.moveTo(x,yy); }); ctx.stroke(); });
    ctx.restore(); ctx.globalAlpha=1; requestAnimationFrame(frame); }
  size(); addEventListener("resize",size,{passive:true});
  new IntersectionObserver(es=>{ const v=es[0].isIntersecting; if(v&&!run){ run=true; last=0; requestAnimationFrame(frame); } else if(!v) run=false; }).observe(c);
  requestAnimationFrame(()=>c.classList.add("on"));
}
function heroParallax(){ $(".hero").addEventListener("pointermove",e=>{ const mx=(e.clientX/innerWidth-.5), my=(e.clientY/innerHeight-.5); mxS=mx; const sv=$("#heroCake>svg"); if(sv) sv.style.transform=`translate(${mx*-16}px,${my*-10}px)`; const sm=$(".hero-snow"); if(sm) sm.style.transform=`translate(${mx*10}px,${my*6}px)`; },{passive:true}); }
const FX={parts:[],on:false};
/* конфетти убрано: на премиальном сайте без «салютов» по каждому клику */
function burst(){ }
function _burstOld(x,y,n=50,power=1){
  if(REDUCED||x==null||(!x&&!y)) return; const c=$("#fx"), ctx=c.getContext("2d"), dpr=Math.min(devicePixelRatio||1,2);
  if(c.width!==innerWidth*dpr){ c.width=innerWidth*dpr; c.height=innerHeight*dpr; } ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols=[FXC.acc,"#E6B3AE","#C2304F","#F2E7D3","#8A5A44","#F2A83B"];
  for(let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.3, sp=(2.5+Math.random()*6)*power;
    FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:2.2+Math.random()*2,h:5+Math.random()*7,life:0,max:55+Math.random()*45,c:cols[i%cols.length],dot:Math.random()<.3}); }
  if(!FX.on){ FX.on=true; requestAnimationFrame(fxLoop); }
  function fxLoop(){ ctx.clearRect(0,0,innerWidth,innerHeight);
    FX.parts=FX.parts.filter(p=>p.life<p.max);
    for(const p of FX.parts){ p.life++; p.vx*=.985; p.vy=p.vy*.985+.16; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.dot){ ctx.beginPath(); ctx.arc(0,0,p.w,0,6.283); ctx.fill(); } else { ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(-p.w/2,-p.h/2,p.w,p.h,p.w/2); else ctx.rect(-p.w/2,-p.h/2,p.w,p.h); ctx.fill(); }
      ctx.restore(); }
    if(FX.parts.length) requestAnimationFrame(fxLoop); else { FX.on=false; ctx.clearRect(0,0,innerWidth,innerHeight); } }
}

/* =========================================================
   ЖИВОЙ ФОН: мягкие пятна света, золотые искорки и сахарная пудра.
   Днём — тёплые пудрово-персиковые тона, ночью — звёздное небо над шоколадом.
   30 кадров в секунду, на телефоне меньше деталей, при «уменьшить движение» — неподвижно.
   ========================================================= */
(function ambient(){
  const c=document.createElement("canvas"); c.id="ambient"; c.setAttribute("aria-hidden","true"); document.body.prepend(c);
  const ctx=c.getContext("2d"); if(!ctx) return;
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,dpr=1, blobs=[], stars=[], dust=[], last=0, raf=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function setup(){
    dpr=Math.min(window.devicePixelRatio||1,1.5); W=innerWidth; H=innerHeight;
    c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    const small=W<700, k=small?.6:1;
    blobs=[0,1,2,3].map(i=>({x:rnd(.1,.9)*W,y:rnd(.1,.9)*H,r:rnd(.28,.42)*Math.max(W,H),vx:rnd(-.08,.08),vy:rnd(-.06,.06),c:i,ph:rnd(0,6.28)}));
    stars=Array.from({length:Math.round(30*k)},()=>({x:rnd(0,W),y:rnd(0,H),s:rnd(2.2,5.5),ph:rnd(0,6.28),sp:rnd(.6,1.4),dr:rnd(-.04,.04)}));
    dust=Array.from({length:Math.round(42*k)},()=>({x:rnd(0,W),y:rnd(0,H),r:rnd(.6,1.8),vy:rnd(.08,.25),vx:rnd(-.06,.06),a:rnd(.25,.7),ph:rnd(0,6.28)}));
  }
  const DAY={blob:["236,183,179","244,192,156","217,168,99","214,196,232"],ba:.20,star:"200,150,79",sa:.55,dust:"190,140,80",da:.35};
  const NIGHT={blob:["212,175,55","150,70,90","120,80,40","95,70,140"],ba:.11,star:"243,217,164",sa:.95,dust:"255,246,230",da:.55};
  function star(x,y,s,a,col){ /* четырёхлучевая искорка */
    ctx.fillStyle=`rgba(${col},${a})`; ctx.beginPath(); ctx.moveTo(x,y-s);
    ctx.quadraticCurveTo(x,y,x+s,y); ctx.quadraticCurveTo(x,y,x,y+s); ctx.quadraticCurveTo(x,y,x-s,y); ctx.quadraticCurveTo(x,y,x,y-s); ctx.fill();
    if(a>.5){ ctx.fillStyle=`rgba(${col},${a*.25})`; ctx.beginPath(); ctx.arc(x,y,s*.9,0,6.283); ctx.fill(); }
  }
  function frame(t){
    raf=requestAnimationFrame(frame);
    if(t-last<33) return; const dt=Math.min(60,t-last)||33; last=t;
    draw(t,dt);
  }
  function draw(t,dt){
    const P=document.documentElement.dataset.theme==="night"?NIGHT:DAY, s=t/1000;
    ctx.clearRect(0,0,W,H);
    /* пятна света: медленно плывут и «дышат» */
    blobs.forEach(b=>{
      b.x+=b.vx*dt*.06; b.y+=b.vy*dt*.06;
      if(b.x<-b.r*.3||b.x>W+b.r*.3) b.vx*=-1; if(b.y<-b.r*.3||b.y>H+b.r*.3) b.vy*=-1;
      const r=b.r*(1+.08*Math.sin(s*.25+b.ph)), g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r);
      g.addColorStop(0,`rgba(${P.blob[b.c]},${P.ba})`); g.addColorStop(1,`rgba(${P.blob[b.c]},0)`);
      ctx.fillStyle=g; ctx.fillRect(b.x-r,b.y-r,r*2,r*2);
    });
    /* сахарная пудра: крупинки медленно парят вверх */
    dust.forEach(d=>{
      d.y-=d.vy*dt*.06; d.x+=(d.vx+Math.sin(s*.6+d.ph)*.05)*dt*.06;
      if(d.y<-4){ d.y=H+4; d.x=rnd(0,W); }
      ctx.fillStyle=`rgba(${P.dust},${d.a*P.da})`; ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,6.283); ctx.fill();
    });
    /* искорки: мягко мерцают */
    stars.forEach(st=>{
      st.x+=st.dr*dt*.06; if(st.x<-10) st.x=W+10; if(st.x>W+10) st.x=-10;
      const tw=(Math.sin(s*st.sp+st.ph)+1)/2, a=P.sa*(.15+.85*tw*tw);
      star(st.x,st.y,st.s*(.75+.35*tw),a,P.star);
    });
  }
  setup(); addEventListener("resize",()=>{ setup(); if(still) draw(0,0); });
  if(still){ draw(0,0); new MutationObserver(()=>draw(0,0)).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]}); return; }
  raf=requestAnimationFrame(frame);
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) cancelAnimationFrame(raf); else { last=0; raf=requestAnimationFrame(frame); } });
})();
</script>
